pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://maven.pedropathing.com/" }
        maven { url = "https://mymaven.bylazar.com/releases" }
    }
}

include ':FtcRobotController'
include ':TeamCode'

include ':Ivy'
include ':PedroPathing:core'
include ':PedroPathing:ftc'

project(':Ivy').projectDir = file('TeamCode/lib/Ivy')
project(':PedroPathing:core').projectDir = file('TeamCode/lib/PedroPathing/core')
project(':PedroPathing:ftc').projectDir = file('TeamCode/lib/PedroPathing/ftc')
